Most leaders try to map EVERY variable to control complexity.

Stafford Beer knew in 1972 this is impossible. Too many agents. Too many relationships. Pointless to predict.

You don't need a bigger spreadsheet. You need an ANTIFRAGILE design.

That's where Enterprise Architecture comes in.

EA is NOT an IT issue. It's a business issue.

EA = S + B + T
Strategy + Business + Technology.

It's the organizing logic for how your business processes & IT infrastructure actually standardize and integrate. It's your Foundation for Execution = Business Agility.

Without it? No clear enterprise view. Can't compare BUs. Fragmented power. Duplication. Waste.

The Viable System Model (VSM) is the ultimate tool for DESIGNING that logic.

I broke down the entire Module into a 10-slide carousel:

1️⃣ Why System Dynamics fails vs VSM wins
2️⃣ EA Perspective – The real foundation
3️⃣ Cybernetics – The art of the pilot
4️⃣ Viability, Recursion & Requisite Variety
5️⃣ System 1: The Operation (where value is made)
6️⃣ System 2: Coordination (the anti-oscillatory glue)
7️⃣ System 3 & 3*: Delivery, Control & Audit
8️⃣ System 4: Chief Explorer – Outside & Then
9️⃣ System 5: Policy & Identity – What are we really about?
\uD83D\uDD1F The payoff: Freedom & control are COMPLEMENTARY.

Centralization vs Decentralization is a false choice. VSM proves you can empower autonomy WITHOUT losing control. Leadership at all levels.

\uD83D\uDC49 Swipe through. Honest question: Which System is broken in YOUR org?

Is it S2 (constant turf wars & bottlenecks) or S4 (no one scanning the future)?

ext-white text-xs",style:{background:l.color},children:l.n}),"SYSTEM ",l.n,": ",l.label]}),I("div",{className:"text-xs mt-2 leading-6 opacity-80",children:[l.n===5&&"Determines what organization is about. Shareholders as S5. Veto power over 3 & 4. Roles: governance structure & debate, identity/values/stakeholders, fit into larger system via non-execs.",l.n===4&&"Chief Explorer. Balancing Inside&Now (S3) vs Outside&Then (S4). Scans environment, strategic risks, innovation exploration vs exploitation, org learning, forward planning. Three plannings: Operative=efficiency, Strategic=effectiveness, Normative=legitimacy.",l.n===3&&"CEO day-to-day. Builds primaries into whole. Resource & Performance conversational bargaining (not top-down). Avoid micro-management, requires trust. Handles overflow variety from S2. Excess centralization = authoritarianism.",l.n===2&&"Inevitable when ops join. Anti-oscillatory, non-obtrusive. Spontaneous, convenient. E.g. spinal cord, timetables, signals, protocols, markets. Fail -> bottlenecks, turf wars, conflicting messages.",l.n===1&&"Set of operational elements, primary activities that deliver product/service. Distinguish ops vs services (HR not S1). Recursive unfolding: divisions>BU>depts>teams>individuals. Types: same product, inter-dependent, independent grouped."]}),g("div",{className:"mt-3 text-[10px] tracking-widest uppercase font-bold opacity-50",children:l.sub})]},l.n)),I("div",{className:`p-3 rounded-xl text-[11px] leading-5 ${e?"bg-orange-500/10 text-orange-200 border border-orange-500/20":"bg-orange-50 text-orange-900 border border-orange-200"}`,children:[g("b",{children:"Recursion Law:"})," “A viable system is comprised of viable systems and is part of a larger viable system.” Every level shares same VSM structure."]})]})]})]})}var li=[{id:"overview",label:"Module Overview",title:"Module 6 Overview",subtitle:"Systems Approaches for Organizational Complexity",quote:"“The person who knows ‘how’ will always have a job. The person who knows ‘why’ will always be his boss.” — Diane Ravitch",icon:g(vr,{size:20}),bullets:["6.1 Organizational Complexity – Why dynamics ≠ viability","6.2 Enterprise Architecture EA = S + B + T","6.3 Management Cybernetics – Art of the pilot","6.4 Viable System Model – Systems 1-5 deep dive","6.5 Value of VSM – Freedom & control as complementary"],deepDive:["This module contrasts System Dynamics (capture all variables) with VSM (assumes too complex, designs for antifragility).","Learning outcomes: Learn WHAT Organizational Complexity is, EA perspective, Management Cybernetics, Apply VSM, Groupwork application.","Source backbone: Jackson (2019) Critical Systems Thinking, Bernard (2012) EA, Beer Brain of the Firm 1972, Hoverstadt (2020) VSM chapter."],quizzes:[{q:"What does VSM primarily provide vs System Dynamics?",options:["Captures all variables","Antifragile design for unexpected disturbances","Ignores environment"],correct:1,explanation:"SD tries to capture all variables; VSM assumes too complex and designs for antifragility."},{q:"EA formula in this module?",options:["EA = IT + HR","EA = S + B + T","EA = Strategy only"],correct:1,explanation:"EA = Strategy + Business + Technology; orientation not IT but business issue."}]},{id:"s61",label:"6.1 Org Complexity",title:"6.1 Organizational Complexity",subtitle:"System Dynamics vs VSM",quote:"VSM can enable sub-organisations, struggling at a chaos-point, to break through into new forms of self-organisation.",icon:g(It,{size:20}),bullets:["System Dynamics: assumes we can model all important variables + interconnections","VSM: environment too complex – impossible to anticipate outcomes","Need antifragile design, not exhaustive mapping","VSM allows diversity of purpose within recursive structures for responsiveness","Struggles with people complexity / pluralism – needs soft systems thinking to agree identity before modelling"],deepDive:["System dynamics believes it can capture all important variables impacting system behavior and describe interconnections.","VSM assumes systems and environments are far too complex – so many agents and relationships impossible to identify all, pointless to anticipate outcome of interactions.","What is required is design for organizations that enables them to be 'antifragile' in face of unexpected disturbances.","Looking at stakeholders dimension of SOSM, VSM allows slippage in pluralist direction to accommodate diversity of purpose within recursive structures so whole can be responsive to variety of its environment.","As argued, it struggles with people complexity and pluralism of values/interests. Overall identity must be agreed before serious modelling – therefore soft systems thinking corralled to help."],quizzes:[{q:"Why does VSM reject SD's total modelling?",options:["Too expensive","Too many agents & relationships – impossible to capture","SD is outdated"],correct:1,explanation:"VSM assumes environment too complex to capture all agents/relationships."},{q:"What does VSM need before modelling?",options:["More data","Agreed overall identity via soft systems thinking","IT approval"],correct:1,explanation:"Identity agreement via soft systems needed due to people complexity."}]},{id:"s62",label:"6.2 EA Perspective",title:"6.2 Enterprise Architecture Perspective",subtitle:"EA = S + B + T • Foundation for Execution",quote:"Orientation of EA is not an IT issue – it's a business issue. EA = S + B + T",icon:g(Tr,{size:20}),bullets:["EA = organizing logic for business processes & IT infrastructure reflecting standardization & integration of operating model","Better Foundation for Execution = Business Agility","Without EA: no clear consistent views, can't compare BUs, power fragmented at line-of-business / program / systems owner, duplication & waste","Strategy shifts constantly – rarely offers clear direction for stable IT","Business agility requires EA 'baked into' dynamics of org – leadership at all levels because VSM spreads decision & control"],deepDive:["Source: Bernard (2012) An introduction to enterprise architecture.","EA is analysis and documentation of Enterprise in current and future states from integrated Strategy, Business, Technology perspective.","Problems if NO EA: Leadership no ability to generate clear consistent views, can't compare business units, locus of power for planning at line-of-business, program, systems owner levels – significant differences, overlapping/duplicative functions, waste.","Execution & Link: Business executes Strategy by partly using Technology. Ross, Weill & Robertson (2006): companies execute better because they have better foundation for execution – embedded tech in processes so they can efficiently & reliably execute core operations. Digitized capabilities distinguishing them from competitors.","Foundation for Execution = IT infrastructure and digitized business processes automating company's core capabilities. Provides reliability & predictability."],quizzes:[{q:"What happens without EA?",options:["More agility","Fragmented power & duplication, no clear enterprise view","Lower costs"],correct:1,explanation:"Without EA: no consistent views, can't compare BUs, locus of power fragmented, duplication."},{q:"Why is EA a business issue?",options:["Because IT says so","It enables foundation for execution & business agility","It's only documentation"],correct:1,explanation:"EA = S+B+T provides reliable digitized core capabilities = business agility."}],diagram:"variety"},{id:"s63",label:"6.3 Cybernetics",title:"6.3 Management Cybernetics",subtitle:"The Art of the Pilot • Control & Communication",quote:"Cybernetics means – the art of the pilot. Focus is on the pilot, not the plane.",icon:g(Ir,{size:20}),bullets:["Javier Livas: cybernetics = art of the pilot – racing strategy, control, tactics & ability","Wiener 1948: control & communication in animal & machine – transdisciplinary laws governing control","Matter + Energy + Information = true components of universe","Negative feedback: closed-loop output vs goal, error as basis for adjustment","Governance & cybernetics share root = steering through changing turbulent environment avoiding hazards","Observer perspective: anything can be many systems depending what you measure (Ashby)"],deepDive:["Source: https://www.youtube.com/watch?v=wxp0CQAjUXI&t=614s","Focus to understand principles of management cybernetics with its universal laws. What makes complex orgs work? Why did corporation fail not competitor?","Cybernetics deals with control phenomena. Asks why this happened and not something else.","Wiener defined cybernetics as study of 'control and communication in the animal and the machine' – transdisciplinary science dealing with general laws governing control whatever nature of system.","Negative feedback control system characterized by closed-loop structure, continuous feedback of information about output, compared with predetermined goal, margin of error becomes basis for adjustments.","To tame complexity, managers must use expertise by translating difficult management problems using language/principles of management cybernetics. Modern main challenge = managing information, creating order where otherwise chaos.","Traditional classical science works with direct cause-effect e.g. Newtonian physics. Complex systems by definition not subject to cause-effect analysis. Therefore observer (Manager, Modeler) must identify complex systems and define borders.","Ashby: anything can be many different systems at same time depending what you are measuring."],quizzes:[{q:"What is negative feedback loop?",options:["Output compared to goal, error drives adjustment","One-way command","No measurement needed"],correct:0,explanation:"Closed-loop: output fed back, compared to goal, error triggers adjustment."},{q:"Why observer perspective matters?",options:["Observer defines system borders & what is measured","Observer is irrelevant","Only one true system exists"],correct:0,explanation:"Complex systems not subject to cause-effect; observer defines borders, what counts as system."}]},{id:"vsm-desc",label:"VSM Core",title:"6.3.4 – 6.3.5 VSM Description & Variety Engineering",subtitle:"Viability, Recursion, Requisite Variety",quote:"A viable system is comprised of other viable systems and is part of a larger viable system.",icon:g(yn,{size:20}),bullets:["Viability = capacity to exist & thrive in unpredictable turbulent environments, independent existence, ultra-stable adapting","Beer Brain of the Firm 1972 – VSM as science of organisation using cybernetic principles & human body analogy","Three uses: Diagnosis (normative compare vs real world), Design (clean sheet or redesign), Self-Knowledge (Conant-Ashby: every good regulator must be model of system)","Fractal/recursive nature: same simple design used at all levels – corporation, subsidiary, plant, production line","Law of Requisite Variety – Ashby 1956: only variety can absorb variety – number of possible states","Environment > Organization > Management variety imbalance – resolved via amplifiers & attenuators"],deepDive:["Viability is capacity to exist and thrive in sometimes unpredictable turbulent environments. System that has capacity to maintain independent existence.","Law of Viability: viable system comprised of other viable systems and part of larger viable system.","Complete VSM model first published 1972 in 'Brain of the Firm' where development through application of cybernetic principles to functioning of human body.","Beer seeking science of organisation using systems & cybernetic principles that underpin all organisations (1959-1994). Criterion how orgs create viability. Requires ultra-stable capable of adapting appropriately to chosen environment or adapting environment to suit even if unforeseen.","Not just fulfilling given purpose, also looking how systems create own purposes and maintain/change through time.","Three principle uses: Diagnosis – VSM as normative model to compare against real world to look for weaknesses, mismatches, missing systemic elements. Design – clean sheet or following diagnosis redesign. Self Knowledge – from Conant-Ashby Theorem: every good regulator of system must be a model of that system – ability to manage depends how good model is.","Foundation concept variety = number of possible activities, necessity to limit to those required for survival. Breakthrough understanding could only be achieved with fractal recursive layered structure.","Recursion is one of Management Cybernetics most important ideals and main resource against complexity. Recursive logic, not authority, is 'glue' of viable systems. Powerful idea behind good cybernetic organization is simple design used many times at all different levels.","W. Ross Ashby discovered Law of Requisite Variety applies to every problem of control. At foundation number of possible activities and necessity to limit. VSM working through Ashby's Law: only variety can absorb variety – variety is measure of complexity – number of possible states. If environment demands six varieties and we deliver all six we have requisite variety.","Environment variety far larger than organization, which larger than management – fundamental problem VSM addresses. Mismatches resolved recognizing only part of environmental variety relevant – producing disturbances org must respond to maintain viability. Same relational pattern management vs participants within org.","Complexity dealt with via management amplifiers (delegation, people's commitment and training) and attenuators (exception reporting, modelling and selective conversations). Relevant ENVIRONMENT is all those things that interact or exchange materials, energy, information with SYSTEM – greatest variety, contains inputs SYSTEM needs to sustain life."],quizzes:[{q:"What is Conant-Ashby Theorem?",options:["Every system needs IT","Every good regulator must be a model of that system","Complexity cannot be managed"],correct:1,explanation:"Conant-Ashby 1970: regulator must be model of system – self-knowledge use of VSM."},{q:"How to balance variety mismatch?",options:["Hire more managers","Use amplifiers (delegation, training) & attenuators (exception reporting, modelling)","Ignore environment"],correct:1,explanation:"Amplifiers amplify management variety; attenuators reduce environment/operation variety."},{q:"Law of Requisite Variety?",options:["Only money absorbs risk","Only variety can absorb variety","More hierarchy = better"],correct:1,explanation:"Ashby 1956: only variety can absorb variety – must match demand variety."}],diagram:"variety"},{id:"s1",label:"System 1",title:"System 1: The Operation",subtitle:"Set of operational elements – primary activities",quote:"Products and services are the usual products resulting from System ONE activities.",icon:g(kr,{size:20}),bullets:["System 1 = set of operational elements – primary activities that deliver product/service org exists to provide","Distinguish main activities vs services: HR department NOT part of operation – it's support","Recursive unfolding: divisions > BUs > departments > teams > individuals – corresponds to structural units","Types: (1) Several operations producing same product = process (parts not viable but modelled as such), (2) Inter-dependent ops, (3) Totally independent grouped for convenience","Environmental overlaps: same region different customers, same customers two gas stations, effects of regionalization"],deepDive:["System ONE is 'the set of operational elements of the viable system' (Beer, Heart P.174).","Model starts with unfolding operations – primary activities delivering product/service. Break down into constituent sub-activities. Since activities need resources, unfolding often corresponds to structural units: divisions within company, BUs or departments within divisions, teams within departments. Can carry decomposition down to level of individuals' actions.","SYSTEM 1 can be model of: Several operations that produce one same product – model represents process, even though parts not viable themselves they can be modelled as such. Inter-Dependent Operations. Totally independent operations grouped together because mutual convenience or units of greater whole.","In mapping structure of viable system important to distinguish operation's main activities from other activities that are only services to viable system. Example human resource department of corporation is not part of operation.","Environmental overlaps: Same region different customers. Two gas stations same customers. Effects of regionalization.","Pic credit: mpasho.co.ke – Social Complexity: The Case of Akuku 'Danger'"],quizzes:[{q:"Is HR System 1?",options:["Yes primary","No, it's a service to viable system","Depends on company size"],correct:1,explanation:"HR is service, not primary activity delivering product/service purpose."},{q:"What is recursive unfolding?",options:["Random grouping","Decomposing primary activities into divisions>BUs>depts>teams>individuals","Outsourcing"],correct:1,explanation:"Unfolding complexity corresponds to structural units down to individual actions."}],diagram:"vsm"},{id:"s2",label:"System 2",title:"System 2: Coordination",subtitle:"Anti-oscillatory • Non-obtrusive regulation",quote:"When viable systems, operations or processes come together, a coordinating function is inevitable.",icon:g(Vr,{size:20}),bullets:["Inevitable when operations join – ensures different primary activities don't conflict","Anti-oscillatory function – important in self-organizing systems","Non-obtrusive, spontaneous self-imposed constraints – convenient for all parties","Spinal cord is good example in human body","Examples: dictionaries, street lights, standardization, agendas, timetables, signals, rules, protocols, regulations, contracts, markets","Fails -> bottlenecks, failed production planning, turf wars, conflicting messages, appeals to higher management"],deepDive:["Coordination has to do with mechanisms to ensure different primary activities do not conflict with one another.","Coordination mechanisms can be very simple but extremely powerful and we often take them for granted; imagine chaos in school if no timetable to ensure pupils did not try to get into same Maths lesson same room same time whilst Chemistry teachers had nobody.","It has anti-oscillatory function. Important ingredient in self-organizing systems. Non-obtrusive form of regulation.","On many occasions coordination is spontaneous or seen as self-imposed constraint of activities based on evident gain on behalf of all parties involved. Spinal code is good example in human body.","Other examples: dictionaries, street lights, all kinds of standardization, agendas, timetables, signals, rules, protocols, regulations, contracts, markets. Notice many solutions adopted because convenient for everyone.","Where coordination mechanisms fail we find problems such as: process bottlenecks, failed production planning, turf wars between departments, conflicting messages to customers (internal or external), and appeals to higher management to sort mess."],quizzes:[{q:"System 2 failure symptom?",options:["Bottlenecks & turf wars","More autonomy","Better synergy"],correct:0,explanation:"Failed coordination -> bottlenecks, turf wars, conflicting messages, appeals upward."},{q:"Best analogy for System 2?",options:["Brain","Spinal cord / timetable / traffic lights","Heart"],correct:1,explanation:"Spinal cord, timetables, street lights – non-obtrusive, anti-oscillatory coordination."}],diagram:"vsm"},{id:"s3",label:"System 3 & 3*",title:"System 3 & 3*: Delivery, Control & Audit",subtitle:"CEO Inside&Now – Resource bargaining & monitoring",quote:"Excessive Centralization = Authoritarianism",icon:g(zr,{size:20}),bullets:["System 3: CEO / day-to-day manager – overall perspective not enjoyed by System 1 parts, settles disputes, overrides individual plans for common good","Key: Resource & Performance Management conversational bargaining loop – NOT top-down commands","Agreement of targets matched by reciprocal allocation of resources – often fragmented functionally","Objective: alignment between system & sub-system objectives, balancing resources, creating synergy","Avoid micro-management – deny autonomy = major problem, requires trust foundation","System 3* Audit: enforcer of System 2 agreements, feeds from coordination channel + independent audit channel, without intrusion, direct Environment-System1 interface, police collecting evidence role","Monitoring twofold purpose: manager confidence what they think happening really happening, and managed confidence managers understand issues"],deepDive:["Role of SYSTEM THREE is that of Chief Executive Officer or day to day manager of system that comprises set operations that define company. Has overall perspective not enjoyed by any joining SYSTEM ONE parts. Settles disputes and overrides individual plans in favour of common good.","Has to do with management processes that build primary activities into greater whole, link sub-systems with system of which they are part. Fractal nature allows structured look at relationships.","Key elements of managing cohesion: Resource and Performance Management, and critically balance between two. To ensure viability processes need to be communicative and participative.","Performance measures and targets need to be agreed between sub-systems and management of system of which they are part. Contrast normal practice many organizations where practiced as 'top down' commands and controls.","Arbitrary imposition of either performance targets or resource allocation risks unrealistic demands and increases probability of failure. Agreement of performance targets needs to be matched and balanced by reciprocal allocation of resources.","Very often resource allocation and setting of performance targets dealt with by different parts of management and not connected. Since resources are principal means of delivering performance clearly two activities need to be linked together as conversational loop in which sub-system e.g. department bids for resources with its line management in order to deliver agreed levels of performance.","Since resources may be different sorts – financial, personnel, IT, infrastructure – resource/performance bargaining problematic especially where management fragmented along functional lines.","To be effective managers need to be able to integrate decision making across functions. For managers dealing with performance and resource allocation objective is to ensure organization able to deliver objectives and create synergy. Two major problems: ensuring alignment between objectives of system as whole and those of sub-systems as represented by agreed measures, balancing resources between competing demands to ensure best use and increase synergy of whole.","Charged with ensuring performance is delivered temptation for system managers is to involve themselves in activities of sub-systems and attempt to micro-manage operational problems. Denying managers of sub-systems autonomy they need to solve own problems is major problem in many organizations. More managers can allow autonomy and rely on performance reports from these units more effective units will be at delivering performance demanded by operating environment.","For this to happen requires relationship between managers and units they manage be based on foundation of trust. Monitoring is key process in developing this trust. Deals with overflow of variety that cannot be handled by SYSTEM TWO. Excessive Centralization = Authoritarianism","SYSTEM 3* purpose twofold: allow managers to have confidence what they think is happening in units they manage really is happening, and secondly provide those they manage with confidence that their managers do actually understand issues they face.","SYSTEM 3* is enforcer of agreements reached at SYSTEM TWO. But first needs lot of information to act judiciously and therefore has supervisory role to play of SYSTEM TWO functions. Done directly by feeding from coordination channel and indirectly through another component – audit channel.","System THREE* is name of audit function and channel used to monitor System ONE activities independently, without intervention or intrusion. It connects directly to Environment – Systems ONE interface. E.g. role of police in collecting evidence."],quizzes:[{q:"System 3 resource bargaining should be?",options:["Top-down command","Conversational bargaining loop participative","No resources needed"],correct:1,explanation:"Must be communicative participative bidding for resources to deliver agreed performance."},{q:"System 3* role?",options:["Replace System 2","Independent audit without intrusion, enforces System 2 agreements","Make policy"],correct:1,explanation:"Audit channel feeds from coordination + independent monitoring, police evidence role, builds trust."},{q:"Why trust matters in System 3?",options:["To avoid micro-management & enable autonomy","Trust is irrelevant","To centralize more"],correct:0,explanation:"Trust + monitoring allows autonomy, prevents micro-management, improves delivery."}],diagram:"vsm"},{id:"s45",label:"System 4 & 5",title:"System 4 & 5: Intelligence & Policy",subtitle:"Chief Explorer & Identity – Outside&Then vs Inside&Now",quote:"Viability implies ability to change: itself, its activities, its form, its identity, and the environment in which it operates.",icon:g(Er,{size:20}),bullets:["System 4: Chief Explorer – viability beyond doing well = ability to change identity/environment","Balances Inside&Now (S3) vs Outside&Then (S4) – core tension","Functions: scanning environment for current/future needs, strategic risks, innovation exploration vs exploitation, managing change, organizational model/learning","Learning = behavior change (run to work), Adaptation = structure change (buy car)","Three plannings: Operative=efficiency do things right, Strategic=effectiveness doing right things, Normative=legitimacy identity vision viability","System 5: Identity – what makes entity different, determines what org is about, shareholders as S5 in corporation, veto over 3&4, overrides lower levels","S5 three roles: structure debate & governance (good chairman), manage identity values stakeholders, fit into larger system (non-exec directors, industry bodies)"],deepDive:["Viability implies ability of organization to go beyond merely doing what it does and doing it well and efficiently. Implies ability to change: itself, its activities, its form, its identity, and environment in which it operates. So to be viable organizations need to be able to adapt, and furthermore mechanisms for adaptation need to be present in all levels of organization.","In VSM balancing interests of 'delivery' which has to do with 'inside and now' of organization is 'development' which looks outside organization and into future.","Functions include: Scanning environment for information on current and future needs and trends. Establishing strategic risks. Innovation – exploration versus exploitation. Managing organizational change. Managing organizational model, its key knowledge and organizational learning.","Typical Development activities include: Forward planning. Forecasting. Marketing. Technical or product development.","LEARNING: identification of behaviors or states of being that solve problematic situation. You have learnt to run to get to work on time.","ADAPTATION: change of structure that shows survival capability and worthiness. Sometimes running is not enough, you adapt by buying a car that gets you to work.","Planning is recursive activity that takes place through all levels of organization. SYSTEM 4 = Chief Explorer.","Three types of planning: OPERATIVE PLANNING = EFFICIENCY = TO DO THINGS RIGHT. STRATEGIC PLANNING = EFFECTIVENESS = DOING THE RIGHT THINGS. NORMATIVE PLANNING = LEGITIMACY – Identity, vision, viability.","System FIVE determines and establishes what organization is all about. Role accomplished by exchange that members have amongst themselves. At highest level shareholders are System FIVE of business corporation. They identify purpose of system. System FIVE has vetoing power over System THREE and FOUR.","Policy function three main roles all linked: First ensure proper structure and debate for formulating strategy and running organization – role of good chairman, governance ensuring org has mechanisms for internal cohesion & efficiency and ongoing fit with environment. Second role understand and manage organization's identity – not just values but what it is, what it exists for, who stakeholders are and how relates. Third role follows: understand how organization fits into larger system of which it is part. For department matter of understanding larger organization and politics. At corporate level reason we have non-exec directors and join industry bodies. Overrides decisions taken at lower levels."],quizzes:[{q:"Inside&Now vs Outside&Then balance is between?",options:["System 1 & 2","System 3 & 4","System 4 & 5"],correct:1,explanation:"S3 delivery Inside&Now vs S4 development Outside&Then – core tension."},{q:"Difference Learning vs Adaptation example?",options:["Learning=run to work, Adaptation=buy car","Same thing","Adaptation = more running"],correct:0,explanation:"Learning behavior change, Adaptation structure change."},{q:"System 5 power?",options:["No power","Veto over System 3 & 4, overrides lower levels","Only audits"],correct:1,explanation:"S5 policy determines identity, has veto over 3 & 4."}],diagram:"vsm"},{id:"value",label:"Value & Next",title:"Value of VSM & Application",subtitle:"Why VSM matters for organizational design",quote:"Freedom and control are complementary rather than in opposition.",icon:g(Pr,{size:20}),bullets:["Clear identity embodying purposes achievable in environment understood throughout enterprise – needs reinvention when environment/identity changes","Shared understanding of organizational complexity, rich discourse on design, stability & change, control & coordination, centralization vs decentralization","Solution to centralization vs decentralization: parts given autonomy empowered without threat to control & cohesion – freedom & control complementary","Enables determination of essential BUs and necessary support services – tells managers what structures essential vs dispensable","Spreads decision making & control throughout architecture – leadership at all levels","Groupwork application: diagnose weakness, design new org, self-knowledge via Conant-Ashby"],deepDive:["Source: Jackson (2019) Critical Systems Thinking and the Management of Complexity.","It is essential to establish clear identity for organization that embodies purposes achievable in environment and is understood and agreed upon throughout enterprise. If environment or that identity changes organization will need to reinvent and reconfigure itself.","VSM can provide for shared understanding of organizational complexity and provides for rich discourse on issues of organizational design and structure, stability and change, control and coordination, centralization and decentralization etc.","It demonstrates that there is solution to perennial problem of centralization versus decentralization. Parts can be given autonomy and empowered without any threat to managerial control and organizational cohesion. Indeed freedom and control are complementary rather than in opposition.","Once identity and purposes have been developed VSM enables essential business units and their necessary support services to be determined. It is vehicle for design or diagnosis that tells managers which structures and processes are essential and which can be dispensed with.","Because VSM spreads decision making and control throughout architecture of system it makes sense of idea of leadership at all levels."],quizzes:[{q:"How does VSM solve centralization vs decentralization?",options:["Chooses centralization","Autonomy empowered without threat – freedom & control complementary","Chooses decentralization only"],correct:1,explanation:"VSM shows autonomy + control complementary via recursive structure."},{q:"When must organization reinvent?",options:["Never","When environment or identity changes","Every year"],correct:1,explanation:"If environment or identity changes need reinvention & reconfiguration."}]}];function Bu(){let[e,t]=He.useState(!1),[n,r]=He.useState(0),[l,i]=He.useState("overview"),[o,u]=He.useState({}),[a,d]=He.useState({}),[A,m]=He.useState(5),h=He.useRef(null);He.useEffect(()=>{let p=()=>{let y=window.scrollY,B=document.documentElement.scrollHeight-window.innerHeight;r(B>0?y/B*100:0);let s=li.map((c)=>document.getElementById(c.id)).filter(Boolean),f="overview";for(let c of s)if(c.getBoundingClientRect().top<=120)f=c.id;i(f)};return window.addEventListener("scroll",p,{passive:!0}),p(),()=>window.removeEventListener("scroll",p)},[]);let E=(p,y,B)=>{d((s)=>({...s,[p]:{...s[p]||{},[y]:B}}))};return I("div",{className:`min-h-screen font-[Inter,ui-sans-serif,system-ui] antialiased transition-colors duration-300 ${e?"bg-[#070e22] text-white":"bg-[#fbfcff] text-slate-900"}`,children:[g("style",{children:`
